name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # codeql-alert-suppression-never-engages-in-this-repo-pipeline: proven
      # from raw SARIF that suppressions[] never gets populated here, for
      # anyone, ever -- so the ~105 in-code `// codeql[...]` justifications
      # already written have had no effect.
      #
      # ATTEMPT 1 (queries: security-extended,codeql/javascript-queries:
      # AlertSuppression.ql) was pushed and REJECTED at `codeql database
      # init` time: "Specifier for external repository is invalid:
      # codeql/javascript-queries:AlertSuppression.ql". Reproduced that
      # exact failure locally with the CLI (2.26.4) before touching this
      # file again -- `codeql database init --codescanning-config=...` with
      # that entry under `queries:` fails identically, no push needed to
      # confirm it's broken.
      #
      # ROOT CAUSE, confirmed by reading codeql-action's own source
      # (src/config/db-config.ts): a `queries:` entry gets NO format
      # validation on the action's side -- it's split on commas and handed
      # to the CLI as an opaque string, which database init then appears to
      # try parsing as a git-hosted custom-query reference (owner/repo/path
      # @ref) whenever it isn't a known suite name, hence "external
      # repository". `packs:` entries go through a DIFFERENT, dedicated
      # parser (parsePacksSpecification) explicitly documented as accepting
      # `scope/name[@version][:path]` -- the grammar this actually needs.
      # AlertSuppression.ql itself sits at the pack ROOT (confirmed via a
      # real `codeql pack download codeql/javascript-queries`), not under a
      # subdirectory.
      #
      # ATTEMPT 2 (this one): moved the query into packs: with the correct
      # grammar. Locally this clears the exact "external repository" error
      # attempt 1 hit -- confirmed via `codeql database init` reproducing
      # cleanly past that point. Could NOT get a fully green local
      # database init even for the CURRENT, known-good security-extended-
      # only baseline in this same harness (a separate "javascript-
      # security-extended cannot be found" resolution gap that affects the
      # baseline identically, so it isn't something this change caused --
      # most likely a registry/qlconfig wiring the hosted GitHub runner has
      # that a bare local CLI invocation doesn't). STILL UNVERIFIED IN THE
      # REAL PIPELINE. Check the next run's raw SARIF for a non-empty
      # suppressions[] on a known-annotated result (e.g. one of the
      # js/path-injection sites in server/routes/panelBridge.js) before
      # trusting this closes the card.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
          packs: codeql/javascript-queries:AlertSuppression.ql

      - name: Analyze
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: /language:javascript-typescript
