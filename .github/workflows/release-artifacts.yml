name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ZomboidControlPanel.exe
            build_arg: --windows
          - os: ubuntu-latest
            artifact_name: ZomboidControlPanel
            build_arg: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build platform artifact
        run: node build.js ${{ matrix.build_arg }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ZomboidControlPanel.exe
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ZomboidControlPanel
          path: release

      - name: Generate checksums
        run: |
          cd release
          sha256sum ZomboidControlPanel.exe ZomboidControlPanel > checksums.txt

      - name: Create release manifest
        run: |
          node -e "const fs=require('fs'); const manifest={version:process.env.GITHUB_REF_NAME,builtAt:new Date().toISOString(),artifacts:[{platform:'win',file:'ZomboidControlPanel.exe'},{platform:'linux',file:'ZomboidControlPanel'}]}; fs.writeFileSync('release/release-manifest.json', JSON.stringify(manifest, null, 2));"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ZomboidControlPanel.exe
            release/ZomboidControlPanel
            release/checksums.txt
            release/release-manifest.json
          fail_on_unmatched_files: true
