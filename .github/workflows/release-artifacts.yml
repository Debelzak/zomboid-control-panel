name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-zip
            archive_file: ZomboidControlPanel-windows.zip
            build_arg: --windows
          - os: ubuntu-latest
            artifact_name: linux-tarball
            archive_file: ZomboidControlPanel-linux.tar.gz
            build_arg: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit

      - name: Install client dependencies
        run: npm install --no-audit
        working-directory: client

      - name: Build
        run: node build.js ${{ matrix.build_arg }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ${{ matrix.archive_file }}

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          chmod +x release/ZomboidControlPanel release/start.sh
          tar -czf ${{ matrix.archive_file }} -C release .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_file }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: .

      - name: Download Linux archive
        uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: .

      - name: Generate checksums
        run: sha256sum ZomboidControlPanel-windows.zip ZomboidControlPanel-linux.tar.gz > checksums.txt

      - name: Create release manifest
        run: |
          node -e "
            const fs = require('fs');
            const manifest = {
              version: process.env.GITHUB_REF_NAME,
              builtAt: new Date().toISOString(),
              platform: 'ci',
              artifacts: [
                { platform: 'win',   file: 'ZomboidControlPanel-windows.zip' },
                { platform: 'linux', file: 'ZomboidControlPanel-linux.tar.gz' }
              ]
            };
            fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2));
          "

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZomboidControlPanel-windows.zip
            ZomboidControlPanel-linux.tar.gz
            checksums.txt
            release-manifest.json
          fail_on_unmatched_files: true
